name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload debug APK
        # continue-on-error: by this point the build and tests already ran
        # and would have failed the job on their own if broken, so a repo
        # storage-quota hiccup here (a real recurring issue — see below)
        # shouldn't fail the whole check over something the code has no
        # control over.
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          # Short retention so accumulated debug APKs from every CI run
          # don't perpetually eat into the repo's Actions storage quota —
          # this workflow previously hit "Artifact storage quota has been
          # hit" outright, failing the job even though the build/tests
          # both passed.
          retention-days: 7
